<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnNow | Hệ thống kiến thức</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .completed { opacity: 0.5; filter: grayscale(1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased min-h-screen flex flex-col">

    <header class="border-b border-slate-800/60 bg-slate-950/70 backdrop-blur-lg sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center text-sm">
            <button onclick="goHome()" class="text-slate-400 hover:text-blue-400 flex items-center transition-colors">
                <span class="mr-2">&larr;</span> Trang chủ
            </button>
            <div id="datetime-display" class="text-slate-500 font-mono text-xs bg-slate-900/50 px-3 py-1 rounded-full border border-slate-800"></div>
        </div>
    </header>

    <div id="progress-container" class="hidden max-w-4xl mx-auto w-full px-4 pt-8">
        <div class="flex justify-between text-xs font-bold text-indigo-400 mb-2">
            <span id="prog-title"></span>
            <span id="prog-percent">0%</span>
        </div>
        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
            <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-500"></div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full">
        <div id="view-master" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <h2 class="col-span-full text-2xl font-bold text-white mb-4">Danh mục chương trình</h2>
            <div onclick="loadContent('./data/prog_01.json')" class="bg-slate-900/40 p-6 rounded-2xl border border-slate-700 cursor-pointer hover:border-indigo-500 transition-all">
                <h3 class="text-xl font-bold text-white">Tư duy Hệ thống</h3>
            </div>
        </div>

        <div id="view-content" class="hidden space-y-6">
            <h1 id="doc-title" class="text-3xl font-bold text-white"></h1>
            <div id="tree-container"></div>
        </div>
    </main>

    <footer class="border-t border-slate-800/60 mt-auto bg-slate-950/80 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 py-6 text-center text-xs text-slate-500">
            &copy; Nguyen Trung Kien 2026 - All rights reserved.
        </div>
    </footer>

    <script>
        // --- 1. Header & Khởi tạo ---
        function updateDateTime() {
            document.getElementById('datetime-display').innerText = new Date().toLocaleString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateDateTime, 60000);
        updateDateTime();

        let currentData = null;
        let completedParts = JSON.parse(localStorage.getItem('LearnNowProgress')) || [];

        function goHome() {
            document.getElementById('view-master').classList.remove('hidden');
            document.getElementById('view-content').classList.add('hidden');
            document.getElementById('progress-container').classList.add('hidden');
        }

        // --- 2. Load Content & Render Cây ---
        async function loadContent(url) {
            const res = await fetch(url);
            currentData = await res.json();
            
            document.getElementById('view-master').classList.add('hidden');
            document.getElementById('view-content').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
            
            document.getElementById('doc-title').innerText = currentData.title;
            document.getElementById('prog-title').innerText = currentData.title;
            renderTree();
        }

        function renderTree() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            let total = 0, finished = 0;

            currentData.modules.forEach(mod => {
                mod.parts.forEach(part => {
                    total++;
                    const isDone = completedParts.includes(part.id);
                    if (isDone) finished++;

                    const el = document.createElement('details');
                    el.className = `p-5 mb-4 rounded-xl border transition-all ${isDone ? 'bg-slate-900/30 border-slate-800 completed' : 'bg-slate-900/60 border-slate-700'}`;
                    el.innerHTML = `
                        <summary class="font-bold cursor-pointer flex justify-between">${part.title} <input type="checkbox" ${isDone ? 'checked' : ''} onclick="toggle('${part.id}')"></summary>
                        <div class="mt-4 text-sm text-slate-400">${part.content}</div>
                    `;
                    container.appendChild(el);
                });
            });

            const percent = Math.round((finished / total) * 100);
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-percent').innerText = percent + '%';
        }

        function toggle(id) {
            if (completedParts.includes(id)) completedParts = completedParts.filter(p => p !== id);
            else completedParts.push(id);
            localStorage.setItem('LearnNowProgress', JSON.stringify(completedParts));
            renderTree();
        }
    </script>
</body>
</html>
