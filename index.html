<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnNow | Hệ thống kiến thức</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .completed { opacity: 0.6; filter: grayscale(0.8); }
        .completed .line-through { text-decoration: line-through; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans antialiased min-h-screen">

    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-20">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center mb-2">
                <button onclick="goHome()" class="text-slate-400 hover:text-white">&larr; Về trang chủ</button>
                <div id="progress-text" class="text-xs font-bold text-indigo-400">0% Hoàn thành</div>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div id="view-master" class="space-y-6">
            <h1 class="text-3xl font-bold text-white mb-8">Danh mục chương trình</h1>
            <div id="program-list" class="grid gap-4">
                </div>
        </div>

        <div id="view-content" class="hidden">
            <h1 id="doc-title" class="text-4xl font-black text-white mb-2"></h1>
            <p id="doc-desc" class="text-slate-500 mb-10"></p>
            <div id="tree-container" class="space-y-4"></div>
        </div>
    </main>

    <script>
        let currentData = null;
        const STORAGE_KEY = 'LearnNowProgress';
        let completedParts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function goHome() {
            document.getElementById('view-master').classList.remove('hidden');
            document.getElementById('view-content').classList.add('hidden');
        }

        async function loadContent(jsonUrl) {
            const res = await fetch(jsonUrl);
            currentData = await res.json();
            document.getElementById('view-master').classList.add('hidden');
            document.getElementById('view-content').classList.remove('hidden');
            document.getElementById('doc-title').innerText = currentData.title;
            document.getElementById('doc-desc').innerText = currentData.desc;
            renderTree();
        }

        function renderTree() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            let totalParts = 0;
            let finishedParts = 0;

            currentData.modules.forEach(mod => {
                const modEl = document.createElement('div');
                modEl.innerHTML = `<h3 class="text-xl font-bold text-indigo-300 mt-6 mb-3">${mod.title}</h3>`;
                
                mod.parts.forEach(part => {
                    totalParts++;
                    const isDone = completedParts.includes(part.id);
                    if (isDone) finishedParts++;

                    const partEl = document.createElement('details');
                    if (!isDone) partEl.open = true;
                    partEl.className = `p-5 rounded-xl border transition-all ${isDone ? 'bg-slate-900/30 border-slate-800 completed' : 'bg-slate-900/60 border-slate-700'}`;
                    
                    partEl.innerHTML = `
                        <summary class="cursor-pointer font-bold flex items-center justify-between">
                            <span class="line-through-target ${isDone ? 'line-through' : ''}">${part.title}</span>
                            <input type="checkbox" ${isDone ? 'checked' : ''} onchange="togglePart('${part.id}')" class="w-5 h-5 accent-indigo-500">
                        </summary>
                        <div class="mt-4 pl-4 border-l border-slate-700 text-sm">
                            <p class="mb-4">${part.content}</p>
                            ${part.subparts.map(sub => `
                                <div class="bg-slate-950 p-3 rounded mb-2">
                                    <h4 class="font-bold text-slate-400 text-xs uppercase">${sub.title}</h4>
                                    <p class="mt-1">${sub.content}</p>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    modEl.appendChild(partEl);
                });
                container.appendChild(modEl);
            });

            // Cập nhật Progress
            const percent = totalParts > 0 ? Math.round((finishedParts / totalParts) * 100) : 0;
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').innerText = percent + '% Hoàn thành';
        }

        function togglePart(id) {
            if (completedParts.includes(id)) {
                completedParts = completedParts.filter(p => p !== id);
            } else {
                completedParts.push(id);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(completedParts));
            renderTree();
        }

        // Tạm gọi load test
        loadContent('./data/prog_01.json');
    </script>
</body>
</html>
